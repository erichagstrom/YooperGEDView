ServerName yoopergedview
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Behind a reverse proxy, every request arrives from the proxy's address. The proxy says who the visitor is in
# X-Forwarded-For and whether they used HTTPS in X-Forwarded-Proto. Those headers are believed only on requests
# that come from TRUSTED_PROXY (one address, or one range such as 172.18.0.0/16); from anyone else they are ignored,
# since a visitor could write them too. The program needs the real address to limit sign-in attempts, and needs
# to know about HTTPS to mark its cookie Secure and to build its links.
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy ${TRUSTED_PROXY}
<If "req_novary('X-Forwarded-Proto') == 'https' && %{CONN_REMOTE_ADDR} -ipmatch '${TRUSTED_PROXY}'">
    SetEnv HTTPS on
</If>
# The program sends these three itself on its pages. Here they are set for everything else that Apache
# serves (images, scripts, error pages); the program's copies are dropped first so that none goes out twice.
Header onsuccess unset X-Content-Type-Options
Header onsuccess unset X-Frame-Options
Header onsuccess unset Referrer-Policy
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "same-origin"

<Directory /var/www/yooper/app>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>
# Settings, logs and exports: never served.
<Directory /var/www/yooper/app/index>
    Require all denied
</Directory>
# Program code that is only ever included by other code.
<Directory /var/www/yooper/app/includes>
    Require all denied
</Directory>
# Uploaded files are served as files only, never run.
<Directory /var/www/yooper/app/media>
    php_admin_flag engine off
    <FilesMatch "(?i)\.(php\d?|phtml|phar|pl|cgi|htaccess)$">
        Require all denied
    </FilesMatch>
</Directory>
