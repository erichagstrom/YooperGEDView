name: Checks
# Runs on every pull request and on main, documentation included: a required check that is skipped would leave
# the pull request waiting for ever.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
          tools: composer:v2
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - run: composer audit
      - run: composer lint
      - run: composer cs
      - run: shellcheck tests/*.sh
      # Reports only: app/ has findings at level 0 and no baseline of them has been recorded yet.
      - run: composer stan
        continue-on-error: true
      # New code: highest level, strict rules, no baseline.
      - run: composer stan-src
      - run: composer test

  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, gd, mbstring, zip, dom, curl
          tools: composer:v2
          coverage: none
      - run: composer install --no-dev --no-interaction --no-progress
      - run: tests/smoke.sh

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: cp .env.example .env
      - run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Static file is served, settings folder and installer are not
        run: |
          set -eu
          status() { curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080/$1"; }
          test "$(status GPL.txt)" = 200
          test "$(status index/index.php)" = 403
          test "$(status includes/session.php)" = 403
          test "$(status install.php)" = 403
      - name: The program starts and reaches the database
        run: |
          set -eu
          curl -s -D headers.txt -o body.txt -A "Mozilla/5.0 (X11; Linux x86_64) Gecko/20100101 Firefox/100.0" http://127.0.0.1:8080/index.php
          head -n 12 headers.txt
          head -c 600 body.txt
          if grep -E 'Fatal error|Warning|Deprecated|ERROR [0-9]+:' body.txt; then echo "PHP errors on the page"; exit 1; fi
          grep -qi '^location: install.php' headers.txt || { echo "expected a redirect to the installer"; exit 1; }
          # The program and Apache both know these headers: each must go out exactly once.
          for name in Content-Security-Policy X-Content-Type-Options X-Frame-Options Referrer-Policy; do
            test "$(grep -ic "^$name:" headers.txt)" = 1 || { echo "expected one $name header on a page"; exit 1; }
          done
          curl -s -D static-headers.txt -o /dev/null http://127.0.0.1:8080/GPL.txt
          test "$(grep -ic '^X-Content-Type-Options:' static-headers.txt)" = 1 || { echo "expected one X-Content-Type-Options header on a static file"; exit 1; }
          docker compose exec -T db sh -c 'MYSQL_PWD="$MARIADB_PASSWORD" mariadb -u"$MARIADB_USER" "$MARIADB_DATABASE" -e "SHOW TABLES"' > tables.txt
          grep -q pgv_user tables.txt || { echo "the program did not create its tables"; cat tables.txt; exit 1; }
      # The unit and smoke tests run on SQLite. This runs the same sign-in queries on MariaDB.
      - name: Sign-in attempts are recorded and limited on MariaDB
        run: |
          set -eu
          sql() { docker compose exec -T db sh -c 'MYSQL_PWD="$MARIADB_PASSWORD" mariadb -N -u"$MARIADB_USER" "$MARIADB_DATABASE"'; }
          echo "SHOW TABLES" | sql | grep -qx pgv_sign_in_attempt || { echo "the sign-in attempts table was not created"; exit 1; }
          # The first administrator, made the way a person setting up a site makes it.
          echo "ci-only-password-$RANDOM$RANDOM" | docker compose exec -T web php bin/yooper install ci-admin --email=ci-admin@example.org
          test "$(echo "SELECT COUNT(*) FROM pgv_user_setting WHERE setting_name = 'canadmin' AND setting_value = 'Y'" | sql)" = 1 || { echo "expected one administrator"; exit 1; }
          if echo "ci-only-password-$RANDOM$RANDOM" | docker compose exec -T web php bin/yooper install second --email=second@example.org; then echo "a second administrator must be refused"; exit 1; fi
          # Load the sign-in page for its token, then send the form.
          sign_in() {
            local agent="Mozilla/5.0 (X11; Linux x86_64) Gecko/20100101 Firefox/100.0" csrf
            curl -s -o page.txt -A "$agent" -b cookies.txt -c cookies.txt "http://127.0.0.1:8080/login.php?url=index.php"
            csrf=$(grep -o 'name="csrf" value="[0-9a-f]*"' page.txt | head -n 1 | cut -d'"' -f4)
            curl -s -o body.txt -A "$agent" -b cookies.txt -c cookies.txt \
              --data "action=login&url=index.php&username=ci-admin&password=wrong-password&csrf=$csrf" http://127.0.0.1:8080/login.php
          }
          # What the page said and what was recorded, for when a check below fails.
          explain() {
            grep -o "class='error'.\{0,200\}" body.txt || echo "no message on the page ($(wc -c < body.txt) bytes)"
            echo "SELECT * FROM pgv_sign_in_attempt" | sql
          }
          # The tenth failure brings the lock, and the page says so from then on. The eleventh is not recorded.
          for _ in $(seq 9); do sign_in; done
          grep -q "Unable to authenticate" body.txt || { echo "expected an ordinary refusal on the ninth attempt"; explain; exit 1; }
          sign_in
          grep -q "Too many failed attempts" body.txt || { echo "expected the tenth failure to bring the lock"; explain; exit 1; }
          sign_in
          grep -q "Too many failed attempts" body.txt || { echo "expected the eleventh attempt to be refused by the limit"; explain; exit 1; }
          count=$(echo "SELECT COUNT(*) FROM pgv_sign_in_attempt WHERE user_name = 'ci-admin' AND success = 0" | sql)
          test "$count" = 10 || { echo "expected 10 recorded failures, found $count"; exit 1; }
      - if: failure()
        run: docker compose logs --tail 12 web
