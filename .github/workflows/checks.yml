name: Checks
on:
  push:
    paths-ignore: ['docs/**', '*.md']
  pull_request:
    paths-ignore: ['docs/**', '*.md']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - run: composer audit
      - run: composer lint
      - run: composer cs
      - run: shellcheck tests/*.sh
      # Not blocking until the baseline of existing findings is committed (see phpstan.neon).
      - run: composer stan
        continue-on-error: true
      # New code: highest level, strict rules, no baseline. Runs once src/ holds code.
      - run: composer stan-src
        if: hashFiles('src/**/*.php') != ''

  smoke:
    runs-on: ubuntu-24.04
    # Expected to fail until the program runs on PHP 8.3 (Phase 1). Remove this line when it passes.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, gd, mbstring
          coverage: none
      - run: tests/smoke.sh
